---
layout: default
---

<div class="">
    <div class="">
        {% include carbon.html %}

        <div class="prose">
            <p class="font-bold">
                Published: {{ page.date | date: "%b %-d, %Y" }} by {{
                page.author }}
            </p>

            <div class="prose">{{ content }}</div>
        </div>

        <div class="tags">
            {% for tag in page.tags %}
            <span class="tag is-primary">{{ tag }}</span>
            {% endfor %}
        </div>

        {% include collection-pagination.html %}

        <section class="">
            <div class="">{% include newsletter.html %}</div>
        </section>
    </div>
</div>
