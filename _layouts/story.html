---
layout: default
---

<div class="">
    <div class="">
        {% include carbon.html %}

        <div class="prose">
            <p class="font-bold">
                Published: {{ page.date | date: "%b %-d, %Y" }} by {{
                page.author }}
            </p>

            <div class="my-8 flex flex-row flex-wrap gap-6">
                {% for tag in page.tags %}
                <span class="rounded bg-gray-100 px-4 py-2 text-black"
                    >{{ tag }}</span
                >
                {% endfor %}
            </div>

            <div class="prose">{{ content }}</div>
        </div>

        {% include collection-pagination.html %}

        <section class="">
            <div class="">{% include newsletter.html %}</div>
        </section>
    </div>
</div>
