<footer class="mt-16 bg-gray-950 py-16">
    <div class="container mx-auto">
        {% if site.footer_menu %}
        <ul
            class="mb-8 flex w-full flex-col flex-wrap justify-between gap-4 lg:flex-row"
        >
            {% for item in site.data[site.footer_menu] %}
            <li class="column has-text-centered">
                <a href="{{ item.link | relative_url }}" class="p-4 text-white"
                    >{{ item.name }}</a
                >
            </li>
            {% endfor %}
        </ul>
        {% endif %}
        <p class="text-center text-white">&copy; C.S. Rhymes</p>
    </div>
</footer>
