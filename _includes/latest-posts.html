<h2 class="mb-8 text-2xl font-bold">Latest Blog Posts</h2>

<div class="">
    {% for post in site.posts limit: 3 %}
    <div
        class="relative isolate mb-8 hover:outline-2 hover:outline-amber-400 focus:outline-2 focus:outline-amber-400"
    >
        {% if post.image %}
        <img
            src="{{ post.image | replace: 'http:', 'https:' }}"
            alt="{{ post.title }}"
            class="aspect-16/9"
        />
        {% endif %}

        <div class="px-2">
            <a href="{{ post.url | prepend: site.baseurl }}">
                <h3 class="text-xl font-bold">{{ post.title }}</h3>
                <span class="absolute inset-0 z-10"></span>
            </a>
            <p class="py-4">Published: {{ post.date | date: '%b %-d, %Y' }}</p>
            <div class="prose">
                <p>{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
